name: CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test

  build:
    if: startsWith(github.ref, 'refs/tags/')
    needs: lint-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Build (portable + nsis)
        run: npm run build
        env:
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DeepSeekPet-dist
          path: dist/*.exe
          if-no-files-found: error
